name: workflows

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # split by action so edited and synchronize runs on the same commit do not cancel each other
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

permissions: {}

jobs:
  recommended:
    permissions:
      contents: read # required by actions/checkout
      pull-requests: write # write: format revert PR titles, read: fetch PR titles / list PR files (dorny/paths-filter)
      actions: read # required by zizmor persona audits and referenced_workflows resolution
    uses: $/.github/workflows/recommended.yaml
