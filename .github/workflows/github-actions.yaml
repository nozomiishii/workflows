name: github-actions

on:
  workflow_call:
    inputs:
      persona:
        type: string
        default: auditor
        description: zizmor persona (regular / pedantic / auditor)

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # required by dorny/paths-filter to list PR files via the GitHub API
    outputs:
      src: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect workflow changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            src:
              - '.github/**/*.yaml'

  actionlint:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        # https://github.com/rhysd/actionlint
        #
        # To run locally, execute the following command:
        # docker run --rm -v "$(pwd):$(pwd)" -w "$(pwd)" rhysd/actionlint:latest
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # required for zizmor persona audits to inspect referenced actions metadata
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared zizmor config
        if: ${{ hashFiles('.github/zizmor.yaml') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '[.referenced_workflows[] | select(.path | startswith("nozomiishii/workflows/.github/workflows/github-actions.yaml@")) | .sha] | first // empty')
          : "${sha:?Failed to resolve nozomiishii/workflows SHA from workflow run}"
          mkdir -p .github
          curl -sSfL \
            "https://raw.githubusercontent.com/nozomiishii/workflows/${sha}/.github/zizmor.yaml" \
            -o .github/zizmor.yaml

      - name: Run zizmor
        # https://github.com/zizmorcore/zizmor-action
        #
        # To run locally, execute the following command:
        # uvx zizmor --persona=auditor ./.github/workflows/
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          persona: ${{ inputs.persona }}
          advanced-security: false

  required:
    needs: [changes, actionlint, zizmor]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled"
          exit 1
