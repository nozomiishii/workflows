name: recommended

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the required job. Keep the default GitHub-hosted
          runner in public repos; self-hosted runners on public repos are
          discouraged by GitHub's security hardening guide.
        type: string
        required: false
        default: ubuntu-slim

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # 全チェックを 1 job の step として直列実行する Preset workflow。
  # 設計 (課金・`!cancelled()`・required 集約) は docs/authoring-workflows.md を参照。
  required:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # write: format revert PR titles, read: fetch PR titles / list PR files (dorny/paths-filter)
      actions: read # required by zizmor persona audits and referenced_workflows resolution
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        if: ${{ !cancelled() }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # renovate: datasource=node-version depName=node
          NODE_VERSION: "24.20.0"
          # renovate: datasource=github-releases depName=astral-sh/uv
          UV_VERSION: "0.12.8"
          # renovate: datasource=github-releases depName=cli/cli
          GH_VERSION: "2.98.0"
          # renovate: datasource=npm depName=@nozomiishii/commitlint-config
          COMMITLINT_CONFIG_VERSION: "2.5.0"
        with:
          # self-hosted はマシンの ~/.local/share/mise が永続キャッシュとして機能するため、
          # 数百 MB の GitHub cache 保存がハング・job timeout の原因になる。GitHub-hosted のみ有効化する。
          cache: ${{ runner.environment == 'github-hosted' }}
          mise_toml: |
            [tools]
            node = "${{ env.NODE_VERSION }}"
            uv = "${{ env.UV_VERSION }}"
            gh = "${{ env.GH_VERSION }}"
            # 個人パッケージは aube のダウンロード数ゲートに掛かり、runner では確認プロンプトが user aborted になる
            "npm:@nozomiishii/commitlint-config" = { version = "${{ env.COMMITLINT_CONFIG_VERSION }}", allow_low_downloads = true }

      # ----------------------------------------------------------------
      # pull-request
      # ----------------------------------------------------------------

      # GitHub の Revert ボタンが生成する Revert "..." 形式を conventional commits に変換する。
      # GitHub 側にテンプレート変更機能はない: https://github.com/orgs/community/discussions/121757
      #   Revert "feat: add something" → revert: "feat: add something"
      - name: Format revert PR title
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Revert "') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          new_title="revert: ${PR_TITLE#Revert }"
          gh pr edit "$PR_NUMBER" --title "$new_title" --repo "$REPO"

      - name: Validate PR title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          pr_title=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq .title)
          printf '%s' "${pr_title}" | nozo-commitlint \
            --help-url https://github.com/nozomiishii/configs/tree/main/packages/commitlint-config \
            --verbose

      # ----------------------------------------------------------------
      # secret-scan
      # ----------------------------------------------------------------

      # https://github.com/secretlint/secretlint
      #
      # To run locally, execute the following command:
      # npx --yes @secretlint/quick-start "**/*"
      - name: Run secretlint
        if: ${{ !cancelled() }}
        env:
          # renovate: datasource=npm depName=@secretlint/quick-start
          SECRETLINT_VERSION: "13.0.5"
        # npx は cwd の package.json を読むため、caller repo の devEngines / engines が
        # runner の Node と一致しないと scan 前に落ちる。install と binary の解決は
        # RUNNER_TEMP で行い、scan だけ workspace で実行する
        run: |
          bin=$(cd "${RUNNER_TEMP}" && npx --yes --package "@secretlint/quick-start@${SECRETLINT_VERSION}" -c 'command -v quick-start')
          "${bin}" "**/*"

      # ----------------------------------------------------------------
      # github-actions
      # ----------------------------------------------------------------

      - name: Detect workflow changes
        id: changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            src:
              - '.github/**/*.yaml'

      # https://github.com/rhysd/actionlint
      #
      # To run locally, execute the following command:
      # docker run --rm -v "$(pwd):$(pwd)" -w "$(pwd)" rhysd/actionlint:latest
      - name: Run actionlint
        if: ${{ !cancelled() && steps.changes.outputs.src == 'true' }}
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -color

      - name: Fetch shared zizmor config
        if: ${{ !cancelled() && steps.changes.outputs.src == 'true' && hashFiles('.github/zizmor.yaml') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '[.referenced_workflows[] | select(.path | startswith("nozomiishii/workflows/.github/workflows/recommended.yaml@")) | .sha] | first // empty')
          : "${sha:?Failed to resolve nozomiishii/workflows SHA from workflow run}"
          mkdir -p .github
          curl -sSfL \
            "https://raw.githubusercontent.com/nozomiishii/workflows/${sha}/.github/zizmor.yaml" \
            -o .github/zizmor.yaml

      # https://github.com/zizmorcore/zizmor
      #
      # To run locally, execute the following command:
      # uvx zizmor --persona=auditor --config .github/zizmor.yaml .
      - name: Run zizmor
        if: ${{ !cancelled() && steps.changes.outputs.src == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=pypi depName=zizmor
          ZIZMOR_VERSION: "1.29.0"
        run: uvx --from "zizmor==${ZIZMOR_VERSION}" zizmor --persona auditor --config .github/zizmor.yaml .
